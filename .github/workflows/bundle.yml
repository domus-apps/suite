name: Bundle

# Rebuilds Domus.zip (every released app in one archive) and publishes it
# as this repo's latest release. The site links to the stable URL
# .../releases/latest/download/Domus.zip.
#
# Every run also keeps downloads.json honest: fetching an app's zip here
# counts as a download on that app's release, so the ledger records how
# many times each app was fetched (the site subtracts it), and a pruned
# bundle release takes its own download count with it, so that count is
# banked before the delete (the site shows banked + live).
on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST

permissions:
  contents: write

jobs:
  bundle:
    # macOS: ditto preserves the .app bundles' symlinks and stapled
    # notarization tickets exactly as the app releases shipped them.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Collect the latest release of every app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Domus dl
          : > included.txt
          for repo in oriel transom pharos coffer atrium jamb keystone louver shutter sill lantern scupper; do
            name="$(tr '[:lower:]' '[:upper:]' <<< "${repo:0:1}")${repo:1}"
            if gh release download -R "domus-apps/$repo" --pattern "$name.zip" --dir dl 2>/dev/null; then
              ditto -x -k "dl/$name.zip" Domus/
              tag=$(gh release view -R "domus-apps/$repo" --json tagName --jq .tagName)
              echo "$name $tag" >> included.txt
            else
              echo "skip $repo (no release yet)"
            fi
          done
          [ -s included.txt ] || { echo "no apps released yet"; exit 1; }
          cat included.txt

      - name: Assemble Domus.zip
        run: |
          printf 'Domus — small macOS utilities that feel like home.\nDrag the apps into /Applications.\n\nhttps://domus-apps.com\n' > Domus/README.txt
          ditto -c -k --sequesterRsrc --keepParent Domus Domus.zip

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          {
            echo "Every released Domus app in one zip:"
            echo
            while read -r name tag; do echo "- $name $tag"; done < included.txt
          } > notes.md
          gh release create "$TAG" Domus.zip --latest \
            --title "Domus bundle" --notes-file notes.md \
            -R "${{ github.repository }}"
          # Keep only the three newest bundles, banking each one's download
          # count before it goes.
          PRUNED=0
          for t in $(gh release list -R "${{ github.repository }}" \
            --json tagName --jq '.[].tagName' | tail -n +4); do
            n=$(gh api "repos/${{ github.repository }}/releases/tags/$t" \
              --jq '[.assets[].download_count] | add // 0')
            PRUNED=$((PRUNED + n))
            gh release delete "$t" --cleanup-tag -y -R "${{ github.repository }}"
          done
          echo "$PRUNED" > pruned.txt

      - name: Update the download ledger
        run: |
          PRUNED=$(cat pruned.txt)
          # One fetch per included app this run, plus the banked bundle count.
          jq --argjson pruned "$PRUNED" \
            --argjson apps "$(awk '{print tolower($1)}' included.txt | jq -R . | jq -s .)" \
            '.bundleFetches as $f
             | .bundleFetches = ($f + ($apps | map({(.): (($f[.] // 0) + 1)}) | add))
             | .retiredBundleDownloads += $pruned' \
            downloads.json > downloads.next.json
          mv downloads.next.json downloads.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git commit -q -m "Record this run's fetches in the download ledger"
          git pull --rebase --quiet
          git push --quiet

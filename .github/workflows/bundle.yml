name: Bundle

# Rebuilds Domus.zip (every released app in one archive) and publishes it
# as this repo's latest release. The site links to the stable URL
# .../releases/latest/download/Domus.zip.
on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST

permissions:
  contents: write

jobs:
  bundle:
    # macOS: ditto preserves the .app bundles' symlinks and stapled
    # notarization tickets exactly as the app releases shipped them.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Collect the latest release of every app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Domus dl
          : > included.txt
          for repo in oriel transom pharos coffer atrium jamb keystone louver shutter sill; do
            name="$(tr '[:lower:]' '[:upper:]' <<< "${repo:0:1}")${repo:1}"
            if gh release download -R "domus-apps/$repo" --pattern "$name.zip" --dir dl 2>/dev/null; then
              ditto -x -k "dl/$name.zip" Domus/
              tag=$(gh release view -R "domus-apps/$repo" --json tagName --jq .tagName)
              echo "$name $tag" >> included.txt
            else
              echo "skip $repo (no release yet)"
            fi
          done
          [ -s included.txt ] || { echo "no apps released yet"; exit 1; }
          cat included.txt

      - name: Assemble Domus.zip
        run: |
          printf 'Domus — small macOS utilities that feel like home.\nDrag the apps into /Applications.\n\nhttps://domus-apps.com\n' > Domus/README.txt
          ditto -c -k --sequesterRsrc --keepParent Domus Domus.zip

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          {
            echo "Every released Domus app in one zip:"
            echo
            while read -r name tag; do echo "- $name $tag"; done < included.txt
          } > notes.md
          gh release create "$TAG" Domus.zip --latest \
            --title "Domus bundle" --notes-file notes.md \
            -R "${{ github.repository }}"
          # Keep only the three newest bundles — but bank their download
          # counts first: a deleted release takes its numbers with it, and
          # the site shows all-time bundle downloads as banked + live.
          PRUNED=0
          for t in $(gh release list -R "${{ github.repository }}" \
            --json tagName --jq '.[].tagName' | tail -n +4); do
            n=$(gh api "repos/${{ github.repository }}/releases/tags/$t" \
              --jq '[.assets[].download_count] | add // 0')
            PRUNED=$((PRUNED + n))
            gh release delete "$t" --cleanup-tag -y -R "${{ github.repository }}"
          done
          if [ "$PRUNED" -gt 0 ]; then
            BANK=$(cat banked-downloads.txt 2>/dev/null || echo 0)
            echo $((BANK + PRUNED)) > banked-downloads.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --quiet
            git add banked-downloads.txt
            git commit -m "Bank $PRUNED pruned bundle downloads"
            git push
          fi
